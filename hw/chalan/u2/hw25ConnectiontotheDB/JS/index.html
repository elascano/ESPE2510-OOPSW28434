<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Contacts</title>
    <style>
        body {
            background: #d3d7df;
            font-family: Segoe UI, sans-serif;
        }
        h1 {
            text-align: center;
            margin-top: 20px;
        }
        .container {
            width: 90%;
            margin: auto;
            margin-top: 20px;
        }
        label {
            font-weight: bold;
        }
        input, select, textarea {
            padding: 6px;
            width: 200px;
        }
        textarea {
            height: 120px;
            width: 300px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 200px auto 200px;
            gap: 20px;
        }
        .save-btn {
            display: block;
            margin: 25px auto;
            padding: 10px 25px;
        }
        .listbox {
            width: 200px;
            height: 140px;
        }
    </style>
</head>

<body>
<h1>CONTACTS</h1>

<div class="container">
    <div class="form-grid">

        <div>
            <label>Id:</label><br>
            <input id="id" disabled><br><br>

            <label>First Name:</label><br>
            <input id="firstName"><br><br>

            <label>Last Name:</label><br>
            <input id="lastName"><br><br>

            <label>Birth Date:</label><br>
            <input id="birthDate" type="date"><br><br>

            <label>Age:</label><br>
            <input id="age" disabled><br><br>

            <label>Type:</label><br>
            <select id="type">
                <option>Family</option>
                <option>Friends</option>
                <option>Job</option>
                <option>Unknown</option>
            </select><br><br>

            <label>Sex:</label><br>
            <input type="radio" name="sex" value="Male"> Male<br>
            <input type="radio" name="sex" value="Female"> Female<br><br>

        </div>

        <div>
            <label>Comments:</label><br>
            <textarea id="comments"></textarea>
        </div>

        <div>
            <label>Hobbies:</label><br>
            <select id="hobbies" class="listbox" multiple>
                <option>Play soccer</option>
                <option>Djng</option>
                <option>Read</option>
                <option>Cook</option>
                <option>Swim</option>
                <option>Sing</option>
                <option>Play an instrument</option>
            </select>
        </div>

    </div>

    <button class="save-btn" onclick="saveContact()">Save</button>

</div>

<script src="renderer.js"></script>
</body>
</html>
