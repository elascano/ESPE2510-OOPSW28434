<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Toy Shop</title>
</head>
<body>

<h3>Toy Shop</h3>

<label>ID:</label>
<input type="number" id="id"><br><br>

<label>Toy Name:</label>
<input type="text" id="toyName"><br><br>

<label>Price:</label>
<input type="number" id="price"><br><br>

<label>Price IVA (15%):</label>
<input type="number" id="priceIva" disabled><br><br>

<button onclick="saveToy()">Save</button>
<button onclick="findToy()">Find</button>
<button onclick="updateToy()">Update</button>
<button onclick="deleteToy()">Delete</button>
<button onclick="loadTable()">Load</button>

<h3>Toy List</h3>

<table border="1" id="toyTable">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Price</th>
      <th>Price IVA</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>


const api = "http://localhost:3000/toys";


const id = document.getElementById("id");
const toyName = document.getElementById("toyName");
const price = document.getElementById("price");
const priceIva = document.getElementById("priceIva");
const tableBody = document.querySelector("#toyTable tbody");


function clearTable() {
  tableBody.innerHTML = "";
}

async function loadTable() {
  clearTable();

  const res = await fetch(api);
  const toys = await res.json();

  toys.forEach(toy => addToyToTable(toy));
}

function addToyToTable(toy) {
  const row = document.createElement("tr");
  row.innerHTML = `
    <td>${toy.id}</td>
    <td>${toy.name}</td>
    <td>${toy.price.toFixed(2)}</td>
    <td>${toy.priceIva.toFixed(2)}</td>
  `;
  tableBody.appendChild(row);
}


async function saveToy() {
  const data = {
    id: Number(id.value),
    name: toyName.value,
    price: Number(price.value)
  };

  const res = await fetch(api, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });

  const toy = await res.json();
  priceIva.value = toy.priceIva;

  alert("Toy saved");
  loadTable();
}

async function findToy() {
  clearTable();

  const res = await fetch(`${api}/${id.value}`);
  const toy = await res.json();

  if (toy && toy.name) {
    toyName.value = toy.name;
    price.value = toy.price;
    priceIva.value = toy.priceIva;

    addToyToTable(toy);
  } else {
    alert("Toy not found");
  }
}

async function updateToy() {
  await fetch(api, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      id: Number(id.value),
      name: toyName.value,
      price: Number(price.value)
    })
  });

  alert("Toy updated");
  loadTable();
}

async function deleteToy() {
  await fetch(`${api}/${id.value}`, { method: "DELETE" });

  id.value = "";
  toyName.value = "";
  price.value = "";
  priceIva.value = "";

  alert("Toy deleted");
  loadTable();
}
</script>

</body>
</html>
