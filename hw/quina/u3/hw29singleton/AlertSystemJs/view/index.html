<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Update Minimum Stock</title>
    <style>
        body { font-family: Arial; display: flex; justify-content: center; padding-top: 50px; background: #ececec; }
        .panel { background: #d3d3d3; padding: 40px; border: 2px solid #999; text-align: center; width: 350px; }
        h2 { font-size: 18px; margin-bottom: 20px; }
        input { width: 80%; padding: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="panel">
        <h2>UPDATE MINIMUM STOCK</h2>
        <input type="number" id="stockInput" placeholder="">
        <br>
        <button onclick="sendUpdate()">Update</button>
    </div>

    <script>
        async function sendUpdate() {
            const val = document.getElementById('stockInput').value;
            const response = await fetch('/api/update', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ newStock: val })
            });
            const data = await response.json();
            
            alert(data.message);
            data.alerts.forEach(p => {
                alert(`LOW STOCK ALERT\nID: ${p.id}\nProduct: ${p.name}\nStock: ${p.stock}`);
            });
        }
    </script>
</body>
</html>
