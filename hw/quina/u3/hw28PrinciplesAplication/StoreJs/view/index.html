<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Inventory - CRUD System</title>
    <style>
        body {
            background-color: #cbd5e1; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .jframe-container {
            background-color: #e2e8f0; 
            border: 1px solid #94a3b8;
            border-radius: 4px;
            box-shadow: 8px 8px 20px rgba(0, 0, 0, 0.2);
            width: 650px;
            padding: 20px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .form-panel {
            display: grid;
            grid-template-columns: 100px 200px 100px;
            gap: 15px;
            align-items: center;
            margin-bottom: 25px;
            padding: 10px;
        }

        label {
            font-weight: bold;
            text-align: right;
        }

        input {
            padding: 6px;
            border: 1px solid #64748b;
            border-radius: 3px;
        }

        button {
            padding: 7px 15px;
            border: 1px solid #475569;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-search { background-color: #bbf7d0; }
        .btn-create { background-color: #dcfce7; }
        .btn-update { background-color: #93c5fd; } 
        .btn-delete { background-color: #f87171; color: white; } 

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            border: 1px solid #64748b;
            margin-bottom: 20px;
        }

        th {
            background-color: #f1f5f9;
            border: 1px solid #64748b;
            padding: 10px;
            text-align: left;
        }

        td {
            border: 1px solid #94a3b8;
            padding: 8px;
        }

        .footer-buttons {
            display: flex;
            justify-content: center;
            gap: 50px;
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <div class="jframe-container">
        <h1>Store Inventory</h1>

        <div class="form-panel">
            <label>ID:</label>
            <input type="text" id="txtId" placeholder="Enter ID">
            <div></div> <label>Name:</label>
            <input type="text" id="txtName" placeholder="Product name">
            <button id="btnSearch" class="btn-search">Search</button>

            <label>Base Price:</label>
            <input type="number" id="txtPrice" step="0.01" placeholder="0.00">
            <button id="btnCreate" class="btn-create">Create</button>
        </div>

        <div style="max-height: 250px; overflow-y: auto;">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Base Price</th>
                        <th>Final Price</th>
                    </tr>
                </thead>
                <tbody id="tblBody">
                    </tbody>
            </table>
        </div>

        <div class="footer-buttons">
            <button id="btnUpdate" class="btn-update">Update</button>
            <button id="btnDelete" class="btn-delete">Delete</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
