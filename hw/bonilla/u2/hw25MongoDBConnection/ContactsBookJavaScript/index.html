<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Contacts</title>
    <style>
        body {
            font-family: Arial;
            width: 700px;
            margin: auto;
        }
        h1 {
            text-align: center;
            margin-top: 20px;
        }
        .panel {
            border: 1px solid #ccc;
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
        }
        label {
            display: inline-block;
            width: 120px;
            margin-bottom: 5px;
        }
        input, select, textarea {
            width: 200px;
            margin-bottom: 10px;
        }
        textarea {
            width: 250px;
            height: 120px;
        }
        #hobbies {
            width: 200px;
            height: 100px;
        }
        .save-btn {
            display: block;
            margin: auto;
            padding: 10px 20px;
            margin-top: 20px;
            font-size: 16px;
            cursor: pointer;
        }
        .inline {
            display: inline-block;
            vertical-align: top;
        }
    </style>
</head>
<body>

<h1>CONTACTS</h1>

<div class="panel">

    <label>ID:</label>
    <input type="text" id="id" disabled><br>

    <label>First Name:</label>
    <input type="text" id="firstName"><br>

    <label>Last Name:</label>
    <input type="text" id="lastName"><br>

    <label>Birth Date:</label>
    <input type="date" id="birthDate"><br>

    <label>Age:</label>
    <input type="text" id="age" disabled><br>

    <label>Type:</label>
    <select id="type">
        <option>Family</option>
        <option>Friend</option>
        <option>Job</option>
        <option>Unknown</option>
    </select><br>

    <label>Sex:</label>
    <div class="inline">
        <input type="radio" name="sex" value="Male"> Male<br>
        <input type="radio" name="sex" value="Female" checked> Female<br>
    </div><br><br>

    <label>Hobbies:</label>
    <select id="hobbies" multiple>
        <option>Play Soccer</option>
        <option>Dijing</option>
        <option>Read</option>
        <option>Cook</option>
        <option>Swim</option>
        <option>Sing</option>
        <option>Play an instrument</option>
    </select>

    <div class="inline" style="margin-left: 30px;">
        <label>Comments:</label><br>
        <textarea id="comments"></textarea>
    </div>

</div>

<button class="save-btn" onclick="saveContact()">SAVE</button>

<script>
async function saveContact() {
    if (!confirm("Saving contact")) {
        alert("Your data will be lost");
        return emptyFields();
    }

    const firstName = document.getElementById("firstName").value;
    const lastName = document.getElementById("lastName").value;
    const birthDate = document.getElementById("birthDate").value;
    const type = document.getElementById("type").value;
    const comments = document.getElementById("comments").value;
    const sex = document.querySelector('input[name="sex"]:checked').value;
    const hobbies = Array.from(document.getElementById("hobbies").selectedOptions).map(o => o.value);

    const contact = { id: "", firstName, lastName, birthDate, age: "", typeOfContact: type, sex, hobbies, comments };

    try {
        const res = await fetch("/api/saveContact", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(contact)
        });

        const data = await res.json();
        if (!res.ok) {
            console.error("Server error:", data);
            alert("Error saving contact: " + (data.error || JSON.stringify(data)));
            return;
        }

        alert("Your contact is saved (id: " + (data.insertedId || "") + ")");
        emptyFields();
    } catch (err) {
        console.error("Fetch error:", err);
        alert("Network or server error: " + err.message);
    }
}

function emptyFields() {
    document.getElementById("firstName").value = "";
    document.getElementById("lastName").value = "";
    document.getElementById("birthDate").value = "";
    document.getElementById("type").selectedIndex = 0;
    document.querySelector('input[name="sex"][value="Female"]').checked = true;
    document.getElementById("hobbies").selectedIndex = -1;
    document.getElementById("comments").value = "";
}
</script>

</body>
</html>
