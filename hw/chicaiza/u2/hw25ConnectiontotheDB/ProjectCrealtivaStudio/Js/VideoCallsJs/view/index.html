<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Videollamadas</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f0f4f7; display: flex; justify-content: center; padding-top: 40px;">
    <div style="background-color: #ffffff; padding: 30px; border-radius: 10px; width: 400px; box-shadow: 0 0 10px rgba(0,0,0,0.1);">

        <h2 style="text-align: center; margin-bottom: 20px;">Registro de Videollamadas</h2>

        <form id="videoCallForm" style="display: flex; flex-direction: column; gap: 15px;">
            <div>
                <label for="customerId">Nombre del Cliente:</label><br>
                <input type="text" id="customerId" placeholder="Ingrese nombre del cliente" required style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #ccc;">
            </div>

            <div>
                <label for="videoCallDate">Fecha:</label><br>
                <input type="date" id="videoCallDate" required style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #ccc;">
            </div>

            <div>
                <label for="hour">Hora (HH:MM):</label><br>
                <input type="time" id="hour" required style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #ccc;">
            </div>

            <div>
                <label for="medium">Plataforma:</label><br>
                <select id="medium" required style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #ccc;">
                    <option value="">Seleccione</option>
                    <option value="Zoom">Zoom</option>
                    <option value="Meet">Meet</option>
                    <option value="Teams">Teams</option>
                </select>
            </div>

            <div>
                <label for="note">Nota:</label><br>
                <textarea id="note" rows="4" placeholder="Escriba una nota..." style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #ccc;"></textarea>
            </div>

            <div style="display: flex; justify-content: space-between; gap: 10px;">
                <button type="submit" style="flex: 1; padding: 10px; border-radius: 5px; border: none; background-color: #4CAF50; color: white; cursor: pointer;">Guardar</button>
                <button type="button" id="viewCallsBtn" style="flex: 1; padding: 10px; border-radius: 5px; border: none; background-color: #2196F3; color: white; cursor: pointer;">Ver Videollamadas</button>
            </div>
        </form>

        <div id="videoCallsList" style="margin-top: 20px;"></div>
    </div>

    <script src="main.js"></script>
</body>
</html>
