// === Form Reset Function (Limpia campos) ===
function resetForm() {
    // CRÍTICO: Asegura que el ID numérico se borra
    document.getElementById("idField").textContent = ''; 
    
    document.getElementById("firstName").value = '';
    document.getElementById("lastName").value = '';
    document.getElementById("birthDate").value = '';
    document.getElementById("age").value = '';
    document.getElementById("type").value = 'Family'; 
    document.querySelector("input[name='sex'][value='M']").checked = true; 
    document.getElementById("hobbies").selectedIndex = -1; 
    document.getElementById("comments").value = '';
}

// === Load Hobbies Helper ===
function selectHobbies(hobbiesArray) {
    const select = document.getElementById("hobbies");
    Array.from(select.options).forEach(option => {
        option.selected = hobbiesArray.includes(option.value);
    });
}

// === Load Contact for Editing (LLENA EL FORMULARIO) ===
function loadContactForEdit(contact) {
    // Calcular edad al cargar
    let b = new Date(contact.birth_date);
    let t = new Date();
    let age = t.getFullYear() - b.getFullYear();
    let m = t.getMonth() - b.getMonth();
    if (m < 0 || (m === 0 && t.getDate() < b.getDate())) age--;
    
    // Usa el ID NUMÉRICO
    document.getElementById("idField").textContent = contact.contact_id;
    document.getElementById("firstName").value = contact.first_name;
    document.getElementById("lastName").value = contact.last_name;
    // Formatear la fecha a YYYY-MM-DD para el input type="date"
    document.getElementById("birthDate").value = contact.birth_date.substring(0, 10);
    document.getElementById("age").value = age;
    document.getElementById("type").value = contact.type; 
    document.querySelector(`input[name='sex'][value='${contact.sex}']`).checked = true; 
    selectHobbies(contact.hobbies);
    document.getElementById("comments").value = contact.comments;

    // Scroll al formulario
    window.scrollTo(0, 0); 
}

async function searchContact() {
    const query = document.getElementById("searchQuery").value.trim();
    const resultsContainer = document.getElementById("resultsContainer");
    resultsContainer.innerHTML = ""; 

    if (!query) {
        resultsContainer.innerHTML = "<div>Enter name or ID to search.</div>";
        return;
    }

    try {
        const results = await window.api.findContact(query);

        if (results.length === 0) {
            resultsContainer.innerHTML = "<div>No contacts found.</div>";
            return;
