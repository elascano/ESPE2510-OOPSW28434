<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tool Store - CRUD</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Tool Store - CRUD</h1> <section class="card">
      <h2 id="formTitle">Create tool</h2> <form id="toolForm" class="form"> <input type="hidden" id="editingId" />

        <label>
          Tool ID <input type="text" id="tid" placeholder="T001" required /> </label>

        <label>
          Name
          <input type="text" id="name" required />
        </label>

        <label>
          Price (without VAT)
          <input type="number" id="price" min="0" step="0.01" required />
        </label>

        <label>
          VAT Rate (e.g. 0.12)
          <input type="text" id="ivaRate" value="0.12" required />
        </label>

        <label>
          Stock
          <input type="number" id="stock" min="0" step="1" required />
        </label>

        <label>
          Description
          <input type="text" id="description" required />
        </label>

        <div class="row">
          <button type="submit" id="submitBtn">Save</button>
          <button type="button" id="cancelEditBtn" class="hidden">Cancel</button>
          <button type="button" id="searchBtn">Search by ID</button>
          <span id="status" class="status"></span>
        </div>

        <p class="hint">The server calculates and stores <b>priceWithIva</b> automatically.</p>
      </form>
    </section>

    <section class="card">
      <div class="row space-between">
        <h2>Tools</h2> <button type="button" id="reloadBtn">Reload</button>
      </div>

      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Price</th>
            <th>VAT</th>
            <th>With VAT</th>
            <th>Stock</th>
            <th>Description</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="toolsTbody"></tbody> </table>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
