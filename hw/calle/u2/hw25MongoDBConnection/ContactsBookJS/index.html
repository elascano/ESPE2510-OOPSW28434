<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CONTACTS GUI (Electron)</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 20px; 
            margin: 0; 
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid black;
        }

        h1 { 
            text-align: center; 
            margin-bottom: 30px; 
            font-size: 2em;
            border-bottom: 2px solid black;
            padding-bottom: 10px;
        }

        .content-grid { 
            display: flex;
            gap: 30px;
        }

        .left-frame, .right-frame {
            flex: 1;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label { 
            display: block; 
            margin-bottom: 5px; 
            font-weight: 600;
        }

        input[type="text"], 
        input[type="number"], 
        select, 
        textarea { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid black; 
            border-radius: 6px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: black;
            outline: none;
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.2);
        }

        textarea { 
            resize: vertical; 
            min-height: 120px;
        }
        
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }

        .radio-option {
            display: flex;
            align-items: center;
        }
        
        .radio-option label {
            font-weight: normal;
            margin-left: 5px;
            margin-bottom: 0;
            cursor: pointer;
        }

        button { 
            background-color: #ddd; 
            color: black; 
            padding: 12px 25px; 
            border: 1px solid black; 
            border-radius: 6px; 
            cursor: pointer; 
            display: block; 
            margin: 30px auto 0; 
            font-weight: bold; 
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #ccc;
        }

        #message { 
            text-align: center; 
            margin-top: 20px; 
            padding: 15px; 
            border-radius: 6px; 
            font-weight: 600;
            border: 1px solid black;
        }

        .success { 
            border-color: green; 
            color: green; 
        }

        .error { 
            border-color: red; 
            color: red; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CONTACTS</h1>
        <form id="contactForm">
            <div class="content-grid">
                <div class="left-frame">
                    <div class="form-group">
                        <label for="first_name">First Name:</label>
                        <input type="text" id="first_name" name="first_name" required>
                    </div>

                    <div class="form-group">
                        <label for="last_name">Last Name:</label>
                        <input type="text" id="last_name" name="last_name" required>
                    </div>

                    <div class="form-group">
                        <label for="birth_date">Birth Date (dd/mm/yyyy):</label>
                        <input type="text" id="birth_date" name="birth_date" placeholder="DD/MM/YYYY" value="01/01/2000" required>
                        <span id="dateError" class="error" style="display: none; font-size: 0.9em; margin-top: 5px;">Birth date cannot be in the future.</span>
                    </div>

                    <div class="form-group">
                        <label for="age">Age:</label>
                        <input type="text" id="age" name="age" pattern="[0-9]*" inputmode="numeric">
                        <span id="ageError" class="error" style="display: none; font-size: 0.9em; margin-top: 5px;">Only numbers are allowed.</span>
                    </div>

                    <div class="form-group">
                        <label for="type">Type:</label>
                        <select id="type" name="type">
                            <option value="Friend">Friend</option>
                            <option value="Family">Family</option>
                            <option value="Job">Job</option>
                            <option value="Unknown">Unknown</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Sex:</label>
                        <div class="radio-group">
                            <div class="radio-option">
                                <input type="radio" id="sex_male" name="sex" value="Male">
                                <label for="sex_male">Male</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="sex_female" name="sex" value="Female" checked>
                                <label for="sex_female">Female</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="hobbies">Hobbies:</label>
                        <select id="hobbies" name="hobbies">
                            <option value="Cook">Cook</option>
                            <option value="PlaySoccer">PlaySoccer</option>
                            <option value="DJing">DJing</option>
                            <option value="Read">Read</option>
                            <option value="Swim">Swim</option>
                            <option value="Sing">Sing</option>
                            <option value="Play an instrument">Play an instrument</option>
                        </select>
                    </div>
                </div>

                <div class="right-frame">
                    <div class="form-group">
                        <label for="contact_id">ID:</label>
                        <input type="text" id="contact_id" name="contact_id" placeholder="Only digits" pattern="[0-9]*" inputmode="numeric" required>
                        <span id="idError" class="error" style="display: none; font-size: 0.9em; margin-top: 5px;">Only numbers are allowed.</span>
                    </div>

                    <div class="form-group">
                        <label for="comments">Comments:</label>
                        <textarea id="comments" name="comments" rows="8"></textarea>
                    </div>
                </div>
            </div>

            <button type="submit">SAVE CONTACT</button>
            <p id="message"></p>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('contactForm');
            const messageElement = document.getElementById('message');
            const ageInput = document.getElementById('age');
            const idInput = document.getElementById('contact_id');
            const dateInput = document.getElementById('birth_date');
            const ageError = document.getElementById('ageError');
            const idError = document.getElementById('idError');
            const dateError = document.getElementById('dateError');

            const showMessage = (text, isError = false) => {
                messageElement.textContent = text;
                messageElement.className = isError ? 'error' : 'success';
                setTimeout(() => {
                    messageElement.textContent = "";
                    messageElement.className = "";
                }, 5000); 
            };

            const clearForm = () => {
                form.reset(); 
                document.getElementById('type').value = "Friend";
                document.getElementById('hobbies').value = "Cook";
                document.getElementById('sex_female').checked = true;
                document.getElementById('birth_date').value = "01/01/2000";
                ageError.style.display = 'none';
                idError.style.display = 'none';
                dateError.style.display = 'none';
            };

            const validateNumberInput = (event, errorElement) => {
                const input = event.target;
                const value = input.value;
                const cleanedValue = value.replace(/[^0-9]/g, '');

                if (value !== cleanedValue) {
                    input.value = cleanedValue;
                    errorElement.style.display = 'inline';
                    showMessage('Only numbers are allowed for this field.', true);
                } else {
                    errorElement.style.display = 'none';
                }
            };

            const validateDate = (input, errorElement) => {
                const dateValue = input.value;
                const dateParts = dateValue.split('/');
                
                if (dateParts.length === 3) {
                    const day = parseInt(dateParts[0], 10);
                    const month = parseInt(dateParts[1], 10);
                    const year = parseInt(dateParts[2], 10);
                    
                    const inputDate = new Date(year, month - 1, day);
                    const today = new Date();
                    
                    today.setHours(0, 0, 0, 0);

                    if (inputDate > today) {
                        errorElement.style.display = 'inline';
                        showMessage('Birth date cannot be in the future.', true);
                        return false;
                    }
                }

                errorElement.style.display = 'none';
                return true;
            };
            
            ageInput.addEventListener('input', (e) => validateNumberInput(e, ageError));
            idInput.addEventListener('input', (e) => validateNumberInput(e, idError));
            dateInput.addEventListener('change', (e) => validateDate(e.target, dateError));
            dateInput.addEventListener('blur', (e) => validateDate(e.target, dateError));


            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const isAgeValid = !ageInput.value.match(/[^0-9]/);
                const isIdValid = !idInput.value.match(/[^0-9]/);
                const isDateValid = validateDate(dateInput, dateError);

                if (!isAgeValid || !isIdValid || !isDateValid) {
                    showMessage('Validation Error: Please correct the marked fields.', true);
                    return; 
                }

                const formData = new FormData(form);
                const data = Object.fromEntries(formData.entries());
                
                if (window.contactAPI && window.contactAPI.saveContact) {
                    const result = await window.contactAPI.saveContact(data);

                    if (result.error) {
                        showMessage(result.error, true);
                    } else {
                        showMessage(result.message, false);
                        clearForm();
                    }
                } else {
                    console.log("Data to save :", data);
                    showMessage(`Contact saved successfully `, false);
                    clearForm();
                }
            });
            
            clearForm();
        });
    </script>
</body>
</html>
