<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Tool Store - CRUD Profesional</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1><span class="icon">🛠️</span> Ferretería - Panel de Control</h1> 
    
    <section class="card">
      <h2 id="formTitle">Registrar Nueva Herramienta</h2> 
      <form id="toolForm" class="form"> 
        <input type="hidden" id="editingId" />

        <label>
          ID Herramienta 
          <input type="text" id="tid" placeholder="Ej: T001" required /> 
        </label>

        <label>
          Nombre
          <input type="text" id="name" placeholder="Martillo Galpón" required />
        </label>

        <label>
          Precio (Sin IVA)
          <input type="number" id="price" min="0" step="0.01" placeholder="0.00" required />
        </label>

        <label>
          Tasa IVA (Ej: 0.12)
          <input type="number" id="ivaRate" value="0.12" min="0" step="0.01" required />
        </label>

        <label>
          Stock
          <input type="number" id="stock" min="0" step="1" placeholder="10" required />
        </label>

        <label>
          Descripción
          <input type="text" id="description" placeholder="Uso pesado" required />
        </label>

        <div class="row">
          <button type="submit" id="submitBtn">Guardar Herramienta</button>
          <button type="button" id="cancelEditBtn" class="hidden">Cancelar Edición</button>
          <button type="button" id="searchBtn" class="secondary">Buscar por ID</button>
        </div>
        <p id="status" class="status"></p>
      </form>
    </section>

    <section class="card">
      <div class="row space-between">
        <h2>Inventario de Herramientas</h2> 
        <button type="button" id="reloadBtn">🔄 Actualizar Lista</button>
      </div>

      <div class="table-container">
        <table class="table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Precio</th>
              <th>IVA (%)</th>
              <th>Total C/IVA</th>
              <th>Stock</th>
              <th>Descripción</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="toolsTbody"></tbody> 
        </table>
      </div>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
