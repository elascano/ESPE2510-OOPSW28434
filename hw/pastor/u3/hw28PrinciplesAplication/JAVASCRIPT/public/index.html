<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema Genérico JS MVC</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f0f0f0; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #007bff; color: white; }
        input { padding: 5px; margin: 5px; }
        button { padding: 5px 15px; background-color: #28a745; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>SYSTEAM WEB (JS Node)</h2>
        
        <div>
            <label>Name:</label> <input type="text" id="txtName">
            <label>Price:</label> <input type="number" id="txtPrice">
            <button onclick="saveData()">SAVE</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Base Price</th>
                    <th>IVA Price</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>

    <script>
        const API_URL = "http://localhost:3000/api";

        async function loadData() {
            const response = await fetch(`${API_URL}/products`);
            const data = await response.json();
            
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";
            
            data.forEach(item => {
                const row = `<tr>
                    <td>${item.id}</td>
                    <td>${item.name}</td>
                    <td>${item.priceBase}</td>
                    <td>${item.endPrice}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        async function saveData() {
            const name = document.getElementById('txtName').value;
            const price = document.getElementById('txtPrice').value;

            const payload = {
                name: name,
                priceBase: price
            };

            await fetch(`${API_URL}/products`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            document.getElementById('txtName').value = "";
            document.getElementById('txtPrice').value = "";
            loadData();
        }

        loadData();
    </script>
</body>
</html>
